name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: sneat-co/cicd/actions/setup-pnpm-node@main
        with:
          working-directory: .
          install: false

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify peer dependencies
        run: pnpm peers check

      - name: Type-check
        run: pnpm --dir frontend typecheck

      - name: Test with coverage
        run: pnpm --dir frontend test:coverage

      - name: Build the published contract
        run: pnpm --dir frontend build
